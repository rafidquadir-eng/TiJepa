[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tijepa"
version = "0.1.0"
description = "Self-supervised video representations of innate immune activation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rafid Quadir" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "torch>=2.2",
    "tifffile>=2024.1.30",
    "scikit-image>=0.22",
    "trackpy>=0.6",
    "zarr>=2.17",
    "timm>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# these generators embed prose and markdown tables; hard wrapping hurts readability
"scripts/90_make_paper_numbers.py" = ["E501"]
"scripts/91_run_report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs downloaded data; such tests skip automatically when it is absent, so the suite passes on a clean checkout (PLAN_v1.md 11.4)",
]
